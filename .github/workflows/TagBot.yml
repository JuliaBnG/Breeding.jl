name: TagBot

permissions:
  contents: write
  issues: write

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Push tags over SSH so they trigger the tag build in CI.yml;
          # tags pushed with GITHUB_TOKEN start no workflows.
          ssh: ${{ secrets.TAGBOT_KEY }}
